<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <meta name="description" content="A simple CRUD website to save and manage your favorite website information like URL, email, and password.">
    <meta name="keywords" content="CRUD, Website Manager, Save URL, JavaScript CRUD, Web Development">
    <meta name="author" content="Rahaf">
    <!-- Font Awesome & Bootstrap -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- CSS Files -->
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/responsive.css">
</head>
<body>

<section class="form"> 
    <form class="sites_Form w-25 m-auto mt-5 mb-3 rounded-4">
      <h1 class="fs-4 fw-bolder m-auto text-center mb-4">Save your websites info </h1>
      <div class="form-floating mb-3">
         <input type="text" class="form-control" id="siteName" placeholder="">
         <label for="siteName">Site Name</label>
         <p class="error_message text-danger"></p>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="siteURL" placeholder="">
        <label for="siteURL">Site URL</label>
        <p class="error_message text-danger"></p>
      </div>
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="userEmail" placeholder="">
        <label for="userEmail">User Email</label>
        <p class="error_message text-danger"></p>
      </div>
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="userPass" placeholder="">
        <label for="userPass">User Password</label>
        <p class="error_message text-danger"></p>
      </div>
      <div class="edits_btns rounded-4 m-auto my-4 d-flex justify-content-around">
        <button type="submit" class="btn btn-success rounded-0 rounded-start add_btn flex-grow-1 add_btn">Add</button>
        <button type="button" class="btn btn-danger rounded-0 flex-grow-1 remove_all_btn">Remove All</button>
        <button type="reset" class="btn btn-secondary text-white rounded-0 rounded-end reset_btn flex-grow-1">Reset</button>
      </div>
    </form>
    <div class="search w-25 m-auto rounded-4">
        <input type="search" class="form-control search_site" placeholder="search by site name...">
    </div>
</section>

<section class="table my-5 w-75 m-auto py-5 rounded-4">
    <table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Site Namw</th>
      <th scope="col">Site URL</th>
      <th scope="col">User Name</th>
      <th scope="col">User Password</th>
      <th scope="col">Delete/Edit</th>
    </tr>
  </thead>
  <tbody class="table_data">
  </tbody>
</table>
</section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./assets/main.js"></script>
</body>
</html>
